<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivelamento - Formulário</title>
</head>
<body>
    <header>
        <nav class="nav-main">
            <h1 class="nav-brand">Loja do TADS</h1>
        </nav>
    </header>

    <main>
        <section id="signup">
            <h2>Cadastro</h2>
            <form action="Obrigado.html">
                <div>
                    <label for="name">Nome:</label>
                    <input type="text" name="name" placeholder="Nome" required>
                </div>
                <div>
                    <label for="crtl-email">email:</label>
                    <input type="email" name="email"id="crtl-email" placeholder="Digite seu Email" required>
                </div>
                <div>
                    <label for="crtl-password"> Senha:</label>
                    <input type="password" name="senha" id="crtl-password" placeholder="Digite a Senha">
                </div>

                <div>
                    <label for="crtl-city">Cidade:</label>
                    <select name="city" id="crtl-city" required>
                            <option value="">Selecione uma Cidade</option>
                            <option value= 1>Curitiba</option>
                            <option value="porto-alegre">Porto Alegre</option>
                            <option value="sao-paulo"> São Paulo</option>
                    </select>
                </div>


                <button type="submit">Enviar</button>

            </form>
        </section>
    </main>
    <section id="signup">
        <h2>Cidade</h2>
        <form action="obrigado.html">
            <div>
            </div>
            <div>
            </div>
            <div>
            </div>
            <div>
            </div>
            <div>
                <label for="crtl-escolaridade">Escolaridade:</label>
                <div>
                <label for="ensino-fundamental"> Ensino Fundamental</label>
                <input type="radio" name="escolaridade" id="crtl-escolaridade" value=" ensino-fundamental" required>
                <label for="ensino-medio"> Ensino Médio:</label>
                <input type="radio" name="escolaridade" id="crtl-escolaridade" value="ensino-medio" required>
                <label for="ensino-graduacao"> Graduação</label>
                <input type="radio" name="escolaridade" id="crt-graduacao" value="Graduação" required>
            </div>
        </div>
        <button type="submit">Enviar</button>
        <div>
            <label for="ctrl-linguagens"> Linguagens que você conhece</label>
        </div>
        <div>
            <input type="checkbox" name="Linguagens" id="crtl-linguagens-java" value="Java">
            <label for="ctrl-linguagens">Java</label>
            <input type="checkbox" name="Linguagens" id="ctrl-linguagens-css" value="css">
            <label for="ctrl-linguagens"> CSS</label>
            <input type="checkbox" name="Linguagens" id="ctrl-linguagens-javascript" value="javascript">
            <label for="ctrl-linguagens">JavaScript</label>
            <input type="checkbox" name="Linguagens" id="crt-linguagens-csharp" value="javascript">
            <label for="ctrl-linguagens-javascript">C#</label>
        </div>
        </div>

        <button type="submit">Enviar</button>
        </form>

    </section>
</body>
</html>
